<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DeathAdder V2</title>
<style>
/* Dark is the default; light applies when macOS (or the theme picker) says so. app.py sets the
   popover's NSAppearance, and WebKit reports it to the page as prefers-color-scheme. */
:root{--g:#44d62c;--ink:#0b0d0b;--bg:rgba(11,13,11,.9);--c:#171a17;--well:#0b0d0b;--ln:#2a2f2a;--t:#e8ede8;--t2:#8a948a;--t3:#868f86;
  --bad:#ff5a4f;--bad-bg:#2a1414;--bad-ln:#5a2622;--bad-t:#ffb3ad;--tip:#252a25;--tip-ln:#3a413a;--amber:#ffb066;--fill:#44d62c;--field-ln:#687168;--on-edge:transparent;color-scheme:dark}
@media (prefers-color-scheme: light){
:root{--g:#13780a;--ink:#0b0d0b;--bg:rgba(246,248,246,.94);--c:#ffffff;--well:#eef2ee;--ln:#d9e0d9;--t:#141a14;--t2:#4f5a4f;--t3:#5d685d;
  --bad:#c8302a;--bad-bg:#fdecea;--bad-ln:#f3c3bf;--bad-t:#9b231e;--tip:#ffffff;--tip-ln:#d9e0d9;--amber:#9a5200;--fill:#44d62c;--field-ln:#7f897f;--on-edge:#187010;color-scheme:light}
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--t);font:13px/1.35 -apple-system,BlinkMacSystemFont,sans-serif;-webkit-user-select:none;user-select:none;cursor:default}
.pv{background:var(--bg);padding:16px 16px 12px;width:376px}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
button{all:unset;cursor:pointer;box-sizing:border-box}
button:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:1px}
.hd{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--c);border:1.5px solid var(--g);display:flex;align-items:center;justify-content:center;color:var(--g)}
/* the logo comes from app.py (setLogo) as a data URL: WebKit refuses CSS masks from file:// URLs */
.snake{width:34px!important;height:34px!important;width:28px;height:28px;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.name{font-weight:600;font-size:15px;letter-spacing:.03em}
.sub{font-size:12px;color:var(--t2)}
.iconbtn{color:var(--t2);padding:4px;border-radius:6px}.iconbtn:hover{color:var(--t);background:var(--c)}
.banner{margin-top:10px;background:var(--bad-bg);border:1px solid var(--bad-ln);color:var(--bad-t);border-radius:8px;padding:8px 10px;font-size:12px;display:flex;gap:8px;align-items:flex-start}
.sec{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.09em;color:var(--g);margin:20px 2px 10px;font-weight:600}
.sec.btn::after{display:none}
.sec .rule{flex:1;height:1px;background:var(--ln)}
.sec::after{content:"";flex:1;height:1px;background:var(--ln)}
.dim{opacity:.35;pointer-events:none}
.card{background:var(--c);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.seg{display:flex;background:var(--c);border:1px solid var(--ln);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;text-align:center;padding:6px 0;min-height:28px;border-radius:6px;color:var(--t2)}
.seg button:hover{color:var(--t)}
.seg button.on{box-shadow:inset 0 0 0 1px var(--on-edge);background:var(--fill);color:var(--ink);font-weight:600}
.lbl{color:var(--t2);display:flex;align-items:center;gap:4px}
.dpi{all:unset;width:5.2ch;font-size:30px;font-weight:600;color:var(--g);font-variant-numeric:tabular-nums;cursor:text;border-radius:6px}
.dpi:focus{background:var(--well);outline:1px solid var(--ln)}
.link{font-size:12px;color:var(--t2);display:inline-flex;gap:4px;align-items:center}.link:hover{color:var(--t)}
.stin{all:unset;width:100%;text-align:center;padding:4px 0;border-radius:6px;background:var(--well);border:1px solid var(--field-ln);font-variant-numeric:tabular-nums;cursor:text}
.stin.act{border-color:var(--g)}
.fx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fx button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0 11px;border-radius:10px;background:var(--c);border:1px solid var(--ln);font-size:12px;color:var(--t2)}
.fx button:hover{color:var(--t)}
.fx button.on{border-color:var(--g);color:var(--g)}
.fx svg.ic{width:18px;height:18px}
.fx button{position:relative}
.fx .tip{left:0;width:210px;text-align:left}
.fx button:nth-child(3n+2) .tip{left:50%;transform:translateX(-50%)}
.fx button:nth-child(3n) .tip{left:auto;right:0}
.fx button:hover .tip,.fx button:focus-visible .tip{visibility:visible;transition:visibility 0s .3s}
.sws{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 2px 2px}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid var(--field-ln)}
.sw.on{outline:2px solid var(--t);outline-offset:2px}
.slots{display:flex;gap:8px;margin:16px 0 0}
.slot{flex:1;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:var(--c);border:1px solid var(--ln);color:var(--t2);font-size:12px}
.slot:hover{color:var(--t)}
.slot.on{border-color:var(--g);color:var(--t)}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--ln);flex:none}
.tg{width:32px;height:19px;border-radius:10px;background:var(--ln);position:relative;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--t2);transition:left .12s}
.tg.on{background:var(--fill);box-shadow:inset 0 0 0 1px var(--on-edge)}.tg.on::after{left:15px;background:var(--ink)}
input[type=range]{flex:1;accent-color:var(--g)}
input[type=range]:disabled{opacity:.45}
.modes button{display:flex;align-items:center;justify-content:center;gap:5px}
.tabs{display:flex;gap:4px;margin:14px -4px 0;border-bottom:1px solid var(--ln)}
.tabs button{display:flex;align-items:center;gap:6px;padding:10px 10px 11px;color:var(--t2);font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--t)}
.tabs button.on{color:var(--t);border-bottom-color:var(--fill);font-weight:600}
.tabs button.on svg.ic{color:var(--g)}
.tabs .gear{margin-left:auto;padding:10px 10px 11px}
.panel{padding-top:16px}
.panel > .sec:first-of-type{margin-top:0}
.opt{display:flex;align-items:center;gap:10px;min-height:32px;margin-top:6px}
.extras{margin-top:6px;padding-top:2px;border-top:1px solid var(--ln)}
.modes svg.ic,.theme svg.ic{width:14px;height:14px}
.theme{padding:2px}.theme button{display:flex;align-items:center;gap:4px;padding:0 9px;min-height:24px;flex:none}
.i{position:relative;display:inline-flex;color:var(--t3);cursor:help}
.i:hover,.i:focus{color:var(--g);outline:none}
.i:focus-visible{outline:2px solid var(--g);outline-offset:1px;border-radius:50%}
.i::before,.tg::before{content:"";position:absolute;inset:-4px}           /* 24pt touch/click target */
.link{padding:4px 0;margin:-4px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.i .tip,.fx .tip{visibility:hidden;position:absolute;z-index:9;top:calc(100% + 6px);left:-10px;width:230px;background:var(--tip);border:1px solid var(--tip-ln);color:var(--t);font-size:12px;line-height:1.45;padding:8px 10px;border-radius:8px;letter-spacing:0;font-weight:400;white-space:normal;text-transform:none}
.i.up .tip{top:auto;bottom:calc(100% + 6px)}
.i:hover .tip,.i:focus .tip{visibility:visible}
.n{width:18px;height:18px;border-radius:50%;background:var(--fill);color:var(--ink);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:8px;border:1px solid transparent;width:100%}
.row:hover{background:var(--c)}
.row.sel{background:var(--c);border-color:var(--g)}
.act{color:var(--t2);font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act.set{color:var(--g)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pick button{padding:8px 10px;border-radius:8px;background:var(--c);border:1px solid var(--ln);font-size:12px;color:var(--t2);display:flex;gap:6px;align-items:center}
.pick button:hover{color:var(--t)}
.pick button.on{border-color:var(--g);color:var(--g)}
.dash{flex:1;font-size:12px;color:var(--t2);padding:8px 10px;border-radius:8px;border:1px dashed var(--ln);display:flex;gap:6px;align-items:center}
.dash:hover{color:var(--t)}
.dash.rec{border-color:var(--g);color:var(--g)}
.txt{all:unset;flex:1;font:12px ui-monospace,Menlo,monospace;padding:7px 8px;border-radius:7px;background:var(--well);border:1px solid var(--field-ln);cursor:text}
.txt::placeholder{color:var(--t2)}
.err{color:var(--bad);font-size:12px;margin:4px 2px 0}
.small{font-size:11px;color:var(--t3);line-height:1.5}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--ln);font-size:12px;color:var(--t2)}
#toast{position:fixed;left:14px;right:14px;bottom:12px;background:var(--bad-bg);border:1px solid var(--bad-ln);color:var(--bad-t);border-radius:8px;padding:8px 10px;font-size:12px;display:none;z-index:20}
</style>
</head>
<body>
<div class="pv" id="root"></div>
<div id="toast" role="alert"></div>
<script>
// Tabler Icons (MIT), https://tabler.io/icons
const ICONS={"bulb":"<path d=\"M3 12h1m8 -9v1m8 8h1m-15.4 -6.4l.7 .7m12.1 -.7l-.7 .7\" /><path d=\"M9 16a5 5 0 1 1 6 0a3.5 3.5 0 0 0 -1 3a2 2 0 0 1 -4 0a3.5 3.5 0 0 0 -1 -3\" /><path d=\"M9.7 17l4.6 0\" />","gauge":"<path d=\"M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0\" /><path d=\"M12 12m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0\" /><path d=\"M13.41 10.59l2.59 -2.59\" /><path d=\"M7 12a5 5 0 0 1 5 -5\" />","settings":"<path d=\"M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z\" /><path d=\"M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0\" />","message-circle":"<path d=\"M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1\" />","phone-call":"<path d=\"M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2\" /><path d=\"M15 7a2 2 0 0 1 2 2\" /><path d=\"M15 3a6 6 0 0 1 6 6\" />","zzz":"<path d=\"M4 12h6l-6 8h6\" /><path d=\"M14 4h6l-6 8h6\" />","device-desktop":"<path d=\"M3 5a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1v-10z\" /><path d=\"M7 20h10\" /><path d=\"M9 16v4\" /><path d=\"M15 16v4\" />","device-laptop":"<path d=\"M3 19l18 0\" /><path d=\"M5 6m0 1a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v8a1 1 0 0 1 -1 1h-12a1 1 0 0 1 -1 -1z\" />","moon":"<path d=\"M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z\" />","alert-triangle":"<path d=\"M12 9v4\" /><path d=\"M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.6 const $ = s => document.querySelector(s);
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ""}</svg>`;
const opt = (label, icon, cmd, on, tip, note = "") => `<div class="opt"><span class="lbl" style="flex:1">${ic(icon)} ${label} ${info(tip, true)}${note}</span>
  <button class="tg${on ? " on" : ""}" role="switch" aria-checked="${on}" aria-label="${label}" onclick="post('${cmd}',{on:${!on}})"></button></div>`;
const info = (text, up) => `<span class="i${up ? " up" : ""}" tabindex="0" aria-label="${text}">${ic("info-circle")}<span class="tip">${text}</span></span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const post = (cmd, args = {}) => window.webkit?.messageHandlers?.app?.postMessage({cmd, ...args});

const EFFECTS = [
  ["static", "Static", "circle", "One solid colour that stays on."],
  ["breath1", "Breathing", "wind", "Slowly fades your colour in and out, like breathing."],

  ["breathR", "Random", "dice-3", "Breathes in and out, picking a new random colour each time."]];
const THEMES = [["system", "Follow macOS", "device-desktop"], ["light", "Light", "sun"], ["dark", "Dark", "moon"]];
const MODES = [["off", "Off", "power"], ["manual", "Manual", "sun"], ["screen", "Screen", "device-laptop"], ["night", "Night", "moon"]];
const SWATCHES = ["#44d62c", "#ff0000", "#ff6400", "#ffdc00", "#00ffff", "#0050ff", "#9600ff", "#ff0078", "#ffffff"];
const SWATCH_NAMES = ["Razer green", "Red", "Orange", "Yellow", "Cyan", "Blue", "Purple", "Pink", "White"];

                 ["cmd+v", "Paste", "clipboard"], ["cmd+shift+4", "Screenshot", "screenshot"], ["ctrl+up", "Mission Control", "layout-grid"]];
const SYM = {cmd: "⌘", shift: "⇧", alt: "⌥", opt: "⌥", ctrl: "⌃", fn: "fn"};
// event.code -> key name understood by remap.KEYS (physical keys, like remap's ANSI key codes)
const CODE = {Minus: "-", Equal: "=", BracketLeft: "[", BracketRight: "]", Quote: "'", Semicolon: ";", Backslash: "\\",
              Comma: ",", Slash: "/", Period: ".", Backquote: "`", Space: "space", Enter: "return", Tab: "tab",
              Backspace: "delete", Delete: "forwarddelete", Home: "home", End: "end", PageUp: "pageup", PageDown: "pagedown",
              ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right"};

let S = null;                       // last state from the app
const TABS = [["lighting", "Lighting", "bulb"], ["sensor", "Sensor", "gauge"], ["buttons", "Buttons", "mouse"], ["settings", "Settings", "settings"]];
let savedTab = null;
try { savedTab = localStorage.getItem("lastTab"); } catch (e) {}
let ui = {open: null, recording: false, macro: false, editStages: null, err: {}, slot: 0,
          tab: TABS.some(t => t[0] === savedTab) ? savedTab : "lighting"};
function setTab(k, fromKeys) {
  ui.tab = k;
  try { localStorage.setItem("lastTab", k); } catch (e) {}
  render();
  if (fromKeys) $(`#tab-${k}`)?.focus();     // keep keyboard focus on the tab bar; a click doesn't need it
}
function tabKeys(e) {
  const i = TABS.findIndex(t => t[0] === ui.tab), n = TABS.length;
  const j = {ArrowRight: (i + 1) % n, ArrowLeft: (i - 1 + n) % n, Home: 0, End: n - 1}[e.key];
  if (j !== undefined) { e.preventDefault(); setTab(TABS[j][0], true); }
}

function friendly(a) {
  const p = PRESETS.find(x => x[0] === (a || "default"));
  if (p) return p[1];
  if (a.includes(";") || a.startsWith("text ")) return "Macro";
  return a.split("+").map(k => SYM[k] || k.toUpperCase()).join(" ");
}

function render() {
  if (!S) { $("#root").innerHTML = `<div class="sub">Connecting…</div>`; return size(); }
  const live = S.connected, eff = S.effect, two = eff === "breath2";
  const [active, stages] = S.stages || [1, []];
  const mode = S.lightMode || "manual", theme = S.theme || "system";
  const pct = Math.round((mode === "night" ? S.yourLevel : S.brightness) / 2.55);
  const glow = S.lightsOn ? S.colors[0] : "var(--ln)";
  const ownColours = ["spectrum", "breathR", "off"].includes(eff);   // these ignore the colour you pick
  if (!two) ui.slot = 0;
  const slot = ui.slot;
  const colourHtml = ownColours
    ? `<div class="small" style="margin:12px 2px 2px">This effect picks its own colours.</div>`
    : (two ? `<div class="slots">${[0, 1].map(i => `<button class="slot${slot === i ? " on" : ""}" aria-pressed="${slot === i}"
          onclick="ui.slot=${i};render()"><span class="dot" style="background:${S.colors[i]}"></span>Colour ${i + 1}</button>`).join("")}</div>` : "")
      + swRow(slot);
  function swRow(slot) { return `<div class="sws">
      ${SWATCHES.map(c => `<button class="sw${S.colors[slot] === c ? " on" : ""}" style="background:${c}" aria-pressed="${S.colors[slot] === c}" aria-label="${SWATCH_NAMES[SWATCHES.indexOf(c)]}" title="${SWATCH_NAMES[SWATCHES.indexOf(c)]}" onclick="post('colour',{slot:${slot},hex:'${c}'})"></button>`).join("")}
      <span style="flex:1"></span>
      <button class="iconbtn" aria-label="Custom colour" title="Custom colour" onclick="post('customColour',{slot:${slot}})"
        style="${SWATCHES.includes(S.colors[slot]) ? "" : `color:${S.colors[slot]}`}">${ic("palette")}</button></div>`; }

  let stageHtml;
  if (ui.editStages) {
    const e = ui.editStages;
    stageHtml = `<div style="display:flex;gap:4px;margin-top:2px">
        ${e.list.map((d, i) => `<input class="stin${i + 1 === e.active ? " act" : ""}" value="${d}" inputmode="numeric" aria-label="Stage ${i + 1} DPI"
            onfocus="ui.editStages.active=${i + 1};this.parentNode.querySelectorAll('.stin').forEach(x=>x.classList.remove('act'));this.classList.add('act')"
            oninput="ui.editStages.list[${i}]=this.value">`).join("")}
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
        <button class="link" onclick="stageCount(-1)" aria-label="Remove a stage">${ic("minus")}</button>
        <button class="link" onclick="stageCount(1)" aria-label="Add a stage">${ic("plus")}</button>
        <span class="small" style="flex:1">Click a box to make it the active stage</span>
        <button class="link" onclick="ui.editStages=null;ui.err.stages=null;render()">Cancel</button>
        <button class="link" style="color:var(--g)" onclick="saveStages()">${ic("check")} Save</button>
      </div>${ui.err.stages ? `<div class="err">${ui.err.stages}</div>` : ""}`;
  } else {
    stageHtml = `<div class="seg" style="background:var(--well)">${stages.map((d, i) =>
        `<button class="${i + 1 === active ? "on" : ""}" aria-pressed="${i + 1 === active}" aria-label="Stage ${i + 1}, ${d} DPI" onclick="post('stage',{i:${i + 1}})">${d}</button>`).join("")}</div>`;
  }

  let btnHtml = BUTTONS.map(([k, label], idx) => {
    const a = S.buttons[k] || "default", open = ui.open === k;
    let h = `<button class="row${open ? " sel" : ""}" onclick="toggleRow('${k}')" aria-expanded="${open}">
        <span class="n">${idx + 1}</span><span style="flex:1">${label}</span>
        <span class="act${a !== "default" ? " set" : ""}">${esc(friendly(a))}</span>${ic("chevron-down")}</button>`;
    if (open) {
      h += `<div style="padding:0 8px 6px"><div class="pick">${PRESETS.map(([v, l, i]) =>
          `<button class="${a === v ? "on" : ""}" aria-pressed="${a === v}" onclick="setButton('${k}','${v}')">${ic(i)}${l}</button>`).join("")}</div>
        <div style="display:flex;gap:6px">
          <button class="dash${ui.recording ? " rec" : ""}" onclick="startRecord()">${ic("keyboard")}${ui.recording ? "Press keys… Esc cancels" : "Record a shortcut…"}</button>
          <button class="dash${ui.macro ? " rec" : ""}" onclick="ui.macro=!ui.macro;render();ui.macro&&$('#macro').focus()">${ic("list")}Build a macro…</button>
        </div>
        ${ui.macro ? `<div style="display:flex;gap:6px;align-items:center;margin-top:6px">
            <input id="macro" class="txt" aria-label="Macro steps" placeholder="cmd+c; wait 150; cmd+v" value="${esc(PRESETS.some(p => p[0] === a) ? "" : a)}"
              onkeydown="if(event.key==='Enter')setButton('${k}',this.value)">
            ${info("Steps separated by ; run in order. A step is a shortcut like cmd+shift+4, a pause like wait 150 (milliseconds), or text hello to type words. Modifiers: cmd, shift, alt, ctrl, fn. Press Enter to save.", true)}
          </div>` : ""}
        ${ui.err.button ? `<div class="err">${esc(ui.err.button)}</div>` : ""}</div>`;
    }
    return h;
  }).join("");

  const panels = {
    sensor: `
  <div class="card">
    <div style="display:flex;align-items:baseline;justify-content:space-between">
      <div><input class="dpi" id="dpi" value="${S.dpi}" inputmode="numeric" aria-label="DPI" style="width:${String(S.dpi).length + 0.4}ch"
          onkeydown="if(event.key==='Enter'){setDpi(this.value);this.blur()}" onblur="this.value!=String(S.dpi)&&setDpi(this.value)">
        <span style="color:var(--t2)">DPI</span> ${info("Pointer speed. Higher DPI moves the cursor further per inch of mouse movement. Click the number to type any value from 100 to 20000.")}</div>
      ${ui.editStages ? "" : `<button class="link" onclick="ui.editStages={active:${active},list:[${stages}]};render()">${ic("pencil")} Edit</button>`}
    </div>
    ${ui.err.dpi ? `<div class="err">${ui.err.dpi}</div>` : ""}
    <div class="lbl" style="font-size:12px;margin:12px 0 8px">Stages
      ${info("The button under the scroll wheel cycles through these. Click one to switch to it now. Edit changes how many there are (1–5) and their values.")}</div>
    ${stageHtml}
  </div>
  <div style="display:flex;align-items:center;gap:12px;margin-top:16px">
    <span class="lbl" style="width:72px">Polling ${info("How often the mouse reports its position to the Mac. 1000 Hz (every 1 ms) feels smoothest; 125 Hz uses the least CPU but feels choppier.")}</span>
    <div class="seg" style="flex:1">${[125, 500, 1000].map(h => `<button class="${S.poll === h ? "on" : ""}" aria-pressed="${S.poll === h}" aria-label="${h} Hz" onclick="post('poll',{hz:${h}})">${h === 1000 ? "1000 Hz" : h}</button>`).join("")}</div>
  </div>

`,
    lighting: `
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
    <span class="lbl" style="width:72px">Zone ${info("Which LEDs the lighting changes below affect: the logo on the palm, the scroll wheel, or both.")}</span>
    <div class="seg" style="flex:1">${[["both", "Both"], ["logo", "Logo"], ["wheel", "Wheel"]].map(([z, l]) =>
        `<button class="${S.zone === z ? "on" : ""}" aria-pressed="${S.zone === z}" onclick="post('zone',{zone:'${z}'})">${l}</button>`).join("")}</div>
  </div>
  <div class="fx">${EFFECTS.map(([k, l, i, d]) => `<button class="${eff === k ? "on" : ""}" aria-pressed="${eff === k}" aria-description="${d}" onclick="post('effect',{effect:'${k}'})">${ic(i)}${l}<span class="tip" aria-hidden="true">${d}</span></button>`).join("")}</div>
  <div class="small" style="margin:8px 2px 0;display:flex;align-items:center;gap:4px">Shows the effect last set here
    ${info("The mouse can't report which effect it's running, so the app remembers what it last set. Effects changed by other apps won't show here.")}</div>
  ${colourHtml}
  <div class="lbl" style="font-size:12px;margin:20px 2px 8px">Brightness
    ${info("Off: LEDs dark, your colours and effect are kept. Manual: you set the level. Screen: follows your MacBook screen, which macOS adjusts to the room light. Night: your level by day; while Night Shift warms your screen, colours turn amber and the LEDs dim by 40%.")}</div>
  <div class="seg modes" role="radiogroup" aria-label="Brightness mode">${MODES.map(([m, l, i]) =>
      `<button role="radio" aria-checked="${mode === m}" class="${mode === m ? "on" : ""}" onclick="post('mode',{mode:'${m}'})">${ic(i)}${l}</button>`).join("")}</div>
  ${mode === "off" ? `<div class="small" style="margin:8px 2px 0">LEDs are off. Your colours and effect are kept.</div>` : `
  <div style="display:flex;align-items:center;gap:12px;margin-top:14px">
    <span style="color:var(--t2)">${ic("sun")}</span>
    <input type="range" min="0" max="100" step="1" value="${pct}" id="br" aria-label="Brightness" aria-valuetext="${pct}%" oninput="bright(this.value)"
      ${mode === "screen" ? `disabled title="Following your MacBook screen. Pick Manual to set it yourself."` : ""}>
    <span id="brv" style="width:34px;text-align:right;color:var(--t2);font-variant-numeric:tabular-nums">${pct}%</span>
  </div>
  <div class="small" style="margin:8px 2px 0${mode === "screen" && !S.autoAvailable ? ";color:var(--bad-t)" : ""}">${
    mode === "screen" ? (S.autoAvailable ? "Following your MacBook screen. It fades along as the room light changes."
                                         : "Your MacBook screen isn't available (lid closed or external monitor only), so the level stays where it is.")
    : mode === "night" ? (S.nightOn ? `<span style="color:var(--amber)">Night Shift is on:</span> warmer colours, 40% dimmer. The slider sets your daytime level.`
                                    : "Normal for now. Turns warmer and dimmer when Night Shift starts (System Settings → Displays).")
    : "You set the level."}</div>`}
`,
    buttons: `
  <div style="display:flex;gap:16px;align-items:center;margin-bottom:12px">
    <svg width="48" height="72" viewBox="0 0 70 104" role="img" aria-label="Mouse seen from above, buttons numbered">
      <path d="M35 4 C58 4 64 26 64 52 C64 82 54 100 35 100 C16 100 6 82 6 52 C6 26 12 4 35 4 Z" style="fill:var(--c);stroke:var(--ln)" stroke-width="1.5"/>
      <line x1="35" y1="4" x2="35" y2="38" style="stroke:var(--ln)" stroke-width="1.5"/>
      <rect x="31" y="14" width="8" height="16" rx="4" style="fill:var(--well);stroke:var(--g)" stroke-width="1.5"/>
      <rect x="2" y="40" width="6" height="12" rx="2" style="fill:var(--g)"/><rect x="2" y="56" width="6" height="12" rx="2" style="fill:var(--g)"/>
      <text x="16" y="50" font-size="11" style="fill:var(--t)">2</text><text x="16" y="66" font-size="11" style="fill:var(--t)">1</text>
      <text x="44" y="26" font-size="11" style="fill:var(--t)">3</text></svg>
    <div style="flex:1">
      <div style="display:flex;align-items:center;gap:6px"><span style="flex:1;display:flex;align-items:center;gap:4px">Custom button actions
        ${info("Lets these three buttons send shortcuts or macros instead of their normal action. Works while this app runs; macOS asks for Accessibility permission the first time. Left click, right click and the DPI button can't be changed.")}</span>
        <button class="tg${S.remapOn ? " on" : ""}" role="switch" aria-checked="${S.remapOn}" aria-label="Custom button actions" onclick="post('remap',{on:${!S.remapOn}})"></button></div>
      ${S.remapWaiting
        ? `<button class="small" style="margin-top:4px;color:var(--bad-t);text-align:left;cursor:pointer" onclick="post('openAccessibility')">
             Waiting for Accessibility permission. <u>Open settings</u>, turn on DeathAdder V2, and it starts by itself.</button>`
        : `<div class="small" style="margin-top:4px">${S.remapOn ? "On. Your actions below are active." : "When off, every button works normally."}</div>`}
    </div>
  </div>
  ${btnHtml}
  <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="link" onclick="post('resetButtons')" title="Set all three buttons back to Normal">${ic("arrow-back-up")} Reset all buttons</button></div>
`,
    settings: `
  <div class="sec" role="heading" aria-level="2">AUTOMATIC</div>
  ${opt("Off when Mac sleeps", "zzz", "sleepOff", S.sleepOff, "The LEDs go dark when your screen sleeps, the Mac goes to sleep or you lock it, and come back as they were when you return.")}
  ${opt("Busy light", "phone-call", "busyLight", S.busyLight, "The mouse glows red while any app uses your microphone or camera (Zoom, Meet, FaceTime, a recording), so people nearby can see you're on a call. It goes back to your lighting when the call ends. macOS only tells the app whether the mic or camera is busy, never what it hears or sees.",
      S.busyLight && S.busyOn ? `<span class="small" style="color:var(--bad)">· on a call</span>` : "")}
  ${opt("DPI pop-up", "message-circle", "dpiPopup", S.dpiPopup, "When you press the DPI button on the mouse, a small overlay shows the new DPI and stage for a second, like the volume pop-up. Changes you make here don't show it.")}
  <div class="sec" role="heading" aria-level="2">APP</div>
  <div class="opt"><span class="lbl" style="flex:1">${ic("device-desktop")} Appearance</span>
    <div class="seg theme" role="radiogroup" aria-label="Theme">${THEMES.map(([t, l, i]) =>
      `<button role="radio" aria-checked="${theme === t}" class="${theme === t ? "on" : ""}" title="${l}" aria-label="${l} theme" onclick="post('theme',{theme:'${t}'})">${ic(i)}${t === "system" ? "Auto" : ""}</button>`).join("")}</div>
  </div>
    ${S.login && S.login !== "unavailable" ? `<div class="opt"><span class="lbl" style="flex:1">${ic("power")} Open at login
      ${S.login === "approval" ? info("macOS is blocking it. Allow DeathAdder V2 in System Settings → General → Login Items.", true) : ""}</span>
      <button class="tg${S.login === "on" ? " on" : ""}" role="switch" aria-checked="${S.login === "on"}" aria-label="Open at login"
        onclick="post('login',{on:${S.login !== "on"}})"></button></div>` : ""}
  <div class="foot"><span class="small">DeathAdder V2 for Mac</span>
    <button class="link" onclick="post('quit')">${ic("power")} Quit</button></div>
`,
  };
  const needsMouse = ui.tab !== "buttons" && ui.tab !== "settings";   // buttons and settings work without it
  $("#root").innerHTML = `
  <div class="hd">
    <div class="logo" style="border-color:${glow};color:${S.lightsOn ? S.colors[0] : "var(--t2)"}">${LOGO
      ? `<span class="snake" role="img" aria-label="Logo" style="--logo:url(${LOGO});background:${S.lightsOn ? S.colors[0] : "var(--t2)"}"></span>`
      : ic("mouse")}</div>
    <div style="flex:1"><div class="name">DEATHADDER <span style="color:var(--g)">V2</span></div>
      <div class="sub">${live ? `<span style="color:var(--g)">●</span> Connected · fw ${esc(S.firmware)}` : `<span style="color:var(--bad)">●</span> Not connected`}</div></div>
    <button class="iconbtn" onclick="post('refresh')" aria-label="Re-read the mouse" title="Re-read the mouse">${ic("refresh")}</button>
  </div>
  ${live ? "" : (/input monitoring/i.test(S.error || "")
    ? `<button class="banner" style="width:100%;text-align:left;cursor:pointer" onclick="post('openSettings')" title="Open Input Monitoring settings">${ic("alert-triangle")}<div>${esc(S.error)}
        <div style="display:flex;gap:14px;margin-top:6px"><span class="link" style="color:var(--bad-t);text-decoration:underline">Open Input Monitoring settings</span>
        <span class="link" style="color:var(--bad-t)" role="button" onclick="event.stopPropagation();post('refresh')">Try again</span></div></div></button>`
    : `<div class="banner">${ic("alert-triangle")}<div>${esc(S.error || "Mouse not found.")}<br><button class="link" style="color:var(--bad-t);margin-top:4px" onclick="post('refresh')">Try again</button></div></div>`)}

  <div class="tabs" role="tablist" aria-label="Sections" onkeydown="tabKeys(event)">${TABS.map(([k, l, i]) =>
    `<button role="tab" id="tab-${k}" aria-controls="panel" aria-selected="${ui.tab === k}" tabindex="${ui.tab === k ? 0 : -1}"
      class="${ui.tab === k ? "on" : ""}${k === "settings" ? " gear" : ""}" ${k === "settings" ? `aria-label="${l}" title="${l}"` : ""}
      onclick="setTab('${k}')">${ic(i)}${k === "settings" ? "" : l}</button>`).join("")}</div>
  <div id="panel" role="tabpanel" aria-labelledby="tab-${ui.tab}" class="panel ${needsMouse && !live ? "dim" : ""}" ${needsMouse && !live ? "inert" : ""}>
  ${panels[ui.tab]}
  </div>`;
  size();
}

function size() { requestAnimationFrame(() => post("size", {h: $("#root").offsetHeight})); }
function toggleRow(k) { ui.open = ui.open === k ? null : k; ui.recording = ui.macro = false; ui.err.button = null; render(); }
function setButton(k, v) { ui.err.button = null; post("button", {name: k, action: v.trim() || "default"}); }
function setDpi(v) {
  const d = Number(v);
  ui.err.dpi = Number.isInteger(d) && d >= 100 && d <= 20000 ? null : "Use a whole number from 100 to 20000.";
  if (ui.err.dpi) return render();
  post("dpi", {dpi: d});
}
function stageCount(n) {
  const e = ui.editStages, len = e.list.length + n;
  if (len < 1 || len > 5) return;
  n > 0 ? e.list.push(e.list[e.list.length - 1] || 800) : e.list.pop();
  e.active = Math.min(e.active, len);
  render();
}
function saveStages() {
  const e = ui.editStages, list = e.list.map(Number);
  if (!list.every(d => Number.isInteger(d) && d >= 100 && d <= 20000)) { ui.err.stages = "Each stage needs a whole number from 100 to 20000."; return render(); }
  ui.err.stages = null; ui.editStages = null;
  post("stages", {active: e.active, list});
}
let brTimer;
function bright(p) {
  $("#brv").textContent = Math.round(p) + "%";
  clearTimeout(brTimer);
  brTimer = setTimeout(() => post("brightness", {level: Math.round(p * 2.55)}), 120);
}
function startRecord() { ui.recording = !ui.recording; ui.macro = false; render(); }
document.addEventListener("keydown", e => {
  if (!ui.recording) return;
  e.preventDefault();
  if (e.code === "Escape") { ui.recording = false; return render(); }
  let key = CODE[e.code] || (e.code.match(/^Key([A-Z])$/) || [])[1]?.toLowerCase() || (e.code.match(/^Digit(\d)$/) || [])[1]
            || (e.code.match(/^F(\d{1,2})$/) ? e.code.toLowerCase() : null);
  if (!key) return;                 // a bare modifier, or a key remap.py doesn't know
  const mods = [e.metaKey && "cmd", e.ctrlKey && "ctrl", e.altKey && "alt", e.shiftKey && "shift"].filter(Boolean);
  ui.recording = false;
  setButton(ui.open, [...mods, key].join("+"));
});

// --- called by app.py ---
let LOGO = null;                    // optional; logo.png isn't in the public repo
function setLogo(uri) { LOGO = uri; render(); }
function setState(s) {
  S = s;
  if (!dragging) render();          // don't rebuild the slider out from under the pointer
}
let dragging = false;
document.addEventListener("pointerdown", e => { dragging = e.target.id === "br"; });
document.addEventListener("pointerup", () => { if (dragging) { dragging = false; render(); } });
function buttonError(msg) { ui.err.button = msg; render(); }
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = "none", 5000);
}
render();
post("ready");
</script>
</body>
</html>
